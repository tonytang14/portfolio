<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Contact | Engineering Portfolio</title>
  <link rel="icon" href="../assets/logo.png?v=4" type="image/png">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="has-particle-background">
  <canvas class="particle-background" aria-hidden="true"></canvas>
  <div class="site-shell">
    <header class="top-banner" aria-label="Portfolio navigation">
      <a class="brand" href="../index.html">Tony Tang</a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="../index.html">About Me</a>
        <a href="projects.html">Projects</a>
        <a href="resume.html">Resume</a>
        <a href="contact.html" aria-current="page">Contact</a>
        <a
          class="linkedin-link"
          href="https://www.linkedin.com/in/tony-tang-002b03328"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Tony Tang on LinkedIn"
        >
          <svg class="linkedin-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
          </svg>
        </a>
      </nav>
    </header>

    <main class="projects-main">
      <section class="contact-section" aria-labelledby="contact-heading">
        <header class="section-header">
          <h2 id="contact-heading">Contact</h2>
        </header>
        <p class="contact-intro">
          Reach out at
          <a href="mailto:tony.tang1401@gmail.com">tony.tang1401@gmail.com</a>
          or send a message below.
        </p>
        <p class="contact-success" role="status" hidden>
          Your message was sent. I will get back to you soon.
        </p>
        <form
          class="contact-form panel-card"
          action="https://formsubmit.co/tony.tang1401@gmail.com"
          method="POST"
          enctype="multipart/form-data"
        >
          <input type="hidden" name="_subject" value="New portfolio message">
          <input type="hidden" name="_captcha" value="false">
          <input type="hidden" name="_template" value="table">
          <input type="text" name="_honey" tabindex="-1" autocomplete="off" hidden aria-hidden="true">
          <input type="hidden" name="_next" value="">
          <input type="hidden" name="_autoresponse" value="Thanks for reaching out. I received your message and will reply soon.">

          <div class="contact-field">
            <label for="contact-name">Name</label>
            <input
              id="contact-name"
              type="text"
              name="name"
              autocomplete="name"
              required
            >
          </div>

          <div class="contact-field">
            <label for="contact-email">Email</label>
            <input
              id="contact-email"
              type="email"
              name="email"
              autocomplete="email"
              required
            >
          </div>

          <div class="contact-field">
            <label for="contact-subject">
              Subject <span class="contact-optional">(optional)</span>
            </label>
            <input
              id="contact-subject"
              type="text"
              name="subject"
              autocomplete="off"
            >
          </div>

          <div class="contact-field">
            <label for="contact-message">Message</label>
            <textarea
              id="contact-message"
              name="message"
              rows="6"
              required
            ></textarea>
          </div>

          <div class="contact-field">
            <label for="contact-attachment">
              Attachment <span class="contact-optional">(optional)</span>
            </label>
            <input
              id="contact-attachment"
              type="file"
              name="attachment"
              multiple
            >
            <p class="contact-field-hint">Up to 10 MB total per message.</p>
          </div>

          <button type="submit" class="contact-submit">Send message</button>
        </form>
      </section>
    </main>
  </div>
  <script src="../js/particles.js"></script>
  <script src="../js/contact-form.js"></script>
  <script src="../js/router.js"></script>
</body>
</html>
